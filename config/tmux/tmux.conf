# Base Setup
#set-option -g default-shell "/usr/bin/fish"
# tmux-256color (not screen-256color) so tmux advertises its own terminfo; the
# Tc override then enables 24-bit colour inside WezTerm. Modern Debian, Ubuntu
# and Fedora ship this entry in ncurses-base, but older and minimal images do
# not, and tmux refuses to start on a terminfo entry it cannot find.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc"
set-option -g history-limit 50000
set -g display-time 4000
set -g mouse on
set -g focus-events on

# Clipboard over SSH. tmux turns an application's OSC 52 sequence into a copy in
# the *local* terminal's clipboard, which is the only thing that works on a
# headless host with no X11 or Wayland selection to talk to.
set -g set-clipboard on

## Window/Pane Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on

set -gq allow-passthrough on



# Binds

## Change Prefix
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

## Pane Switch Alt-Arrow 
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

## Kill session with prefix + X
bind X confirm-before 'kill-session'

## Attach to a named session, creating it if needed. Pairs with the 'ta' shell
## alias, which does the same for the 'main' session.
bind S command-prompt -p "session:" "new-session -A -s '%%'"

## Reload the config without restarting tmux.
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Notifications
setw -g monitor-activity on
set -g visual-activity on

# Theming
set -g status on
set -g status-interval 15
set -g status-right '#(~/.config/scripts/tmux_load.sh) | %Y-%m-%d %H:%M'
set -g status-bg green
set -g status-fg black
setw -g window-status-style fg=black,bg=green,dim
setw -g window-status-current-style fg=black,bg=cyan,dim

set -g set-titles on
set -g set-titles-string "#T"
